name: build-lalabypass

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        run: |
          brew install ldid xz
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: 安装 Theos 与 SDK
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          curl -fL -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz
          ls -l /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks/
          ls $HOME/theos/sdks

      - name: 编译
        run: |
          make clean package DEBUG=0 FINALPACKAGE=1

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: lalabypass-deb
          path: packages/*.deb
          if-no-files-found: error
